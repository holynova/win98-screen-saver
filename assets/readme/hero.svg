<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Win98 屏保 — 11 个 Windows 95/98 经典屏幕保护程序的纯网页版复刻</title>
  <desc id="desc">经典青色桌面底，左上角藏青标题栏；右侧是一台银灰 CRT 显示器，屏幕里星点从中心向外飞掠，下方是彩色 3D 管道示意。</desc>

  <rect width="1200" height="360" rx="26" fill="#00807f"/>

  <g id="title-bar">
    <rect x="24" y="24" width="700" height="44" fill="#000080"/>
    <text x="44" y="53" font-size="21" font-weight="700" fill="#ffffff" font-family="Tahoma, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">屏幕保护程序 — Windows 95 / 98 Collection</text>
    <g>
      <rect x="668" y="32" width="28" height="28" fill="#c0c0c0" stroke="#ffffff" stroke-width="1.5"/>
      <text x="682" y="53" font-size="19" font-weight="700" fill="#000000" text-anchor="middle" font-family="Tahoma, sans-serif">×</text>
    </g>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="132" font-size="60" font-weight="700" fill="#ffffff">Win98 屏保</text>
    <text x="56" y="172" font-size="23" fill="#e8ffff">WINDOWS 95/98 经典屏保 · 纯网页版复刻</text>
    <text x="56" y="208" font-size="19" fill="#ffffff">星空、3D 管道、迷宫……11 个经典动画，调参即时生效。</text>
    <g id="chips" font-size="18" fill="#202124" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="4" fill="#c0c0c0" stroke="#ffffff" stroke-width="1.5"/><text x="119" y="262">11 个屏保</text></g>
      <g><rect x="194" y="238" width="168" height="36" rx="4" fill="#c0c0c0" stroke="#ffffff" stroke-width="1.5"/><text x="278" y="262">Canvas + WebGL</text></g>
      <g><rect x="374" y="238" width="108" height="36" rx="4" fill="#c0c0c0" stroke="#ffffff" stroke-width="1.5"/><text x="428" y="262">可调参</text></g>
      <g><rect x="494" y="238" width="108" height="36" rx="4" fill="#c0c0c0" stroke="#ffffff" stroke-width="1.5"/><text x="548" y="262">全屏欣赏</text></g>
    </g>
  </g>

  <g id="monitor" font-family="Tahoma, -apple-system, 'Segoe UI', sans-serif">
    <rect x="740" y="52" width="400" height="252" rx="8" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="2"/>
    <g>
      <rect x="758" y="68" width="364" height="204" fill="#000000"/>
      <g id="starfield" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <line x1="940" y1="170" x2="918" y2="158"/>
        <line x1="940" y1="170" x2="972" y2="150"/>
        <line x1="940" y1="170" x2="906" y2="186"/>
        <line x1="940" y1="170" x2="984" y2="192"/>
        <line x1="940" y1="170" x2="928" y2="130"/>
        <line x1="940" y1="170" x2="952" y2="212"/>
        <line x1="940" y1="170" x2="880" y2="132"/>
        <line x1="940" y1="170" x2="1000" y2="128"/>
        <line x1="940" y1="170" x2="872" y2="218"/>
        <line x1="940" y1="170" x2="1010" y2="220"/>
      </g>
      <g id="pipes" fill="none" stroke-linecap="round" stroke-width="7">
        <path d="M790 250 H860 V222 H930" stroke="#ff2d78"/>
        <path d="M1090 250 H1030 V228 H990" stroke="#2db3ff"/>
      </g>
      <circle cx="940" cy="170" r="3" fill="#ffffff"/>
    </g>
    <text x="940" y="292" font-size="13" letter-spacing="3" fill="#404040" text-anchor="middle">COLOR DISPLAY</text>
    <rect x="890" y="304" width="100" height="12" rx="3" fill="#a8a8a8"/>
    <rect x="860" y="316" width="160" height="10" rx="3" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="1"/>
  </g>
</svg>
